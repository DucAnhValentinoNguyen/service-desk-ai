[project]
name = "service-desk-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DucAnhValentinoNguyen", email = "ducanhdollar98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "anyio==4.9.0",
    "pytest==8.3.4",
]

[project.scripts]
service-desk-ai = "service_desk_ai:main"

[build-system]
